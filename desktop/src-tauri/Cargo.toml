[package]
name = "antigravity_account_manager"
version = "0.1.0"
description = "Antigravity Account Manager for OpenCode"
authors = ["d-init-d"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["api-all", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
uuid = { version = "1.6", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
